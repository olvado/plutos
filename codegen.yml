schema: http://localhost:3000/graphql
documents:
  - app/javascript/graphql/queries/**/*.graphql
  - app/javascript/graphql/mutations/**/*.graphql
generates:
  app/javascript/graphql/generated/index.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-apollo
    config:
      withHooks: true
      withComponent: false
      withHOC: false
